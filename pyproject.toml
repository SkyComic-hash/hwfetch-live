[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwfetch-live"
version = "0.1.0"
description = "Fastfetch-style static hardware info + real-time power telemetry TUI for hybrid-graphics Linux laptops"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hwfetch-live contributors" }]
requires-python = ">=3.9"
keywords = ["tui", "hardware", "monitor", "power", "nvidia", "rapl", "battery"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=0.52",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.535"]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
hwfetch-live = "hwfetch_live.main:main"

[project.urls]
Homepage = "https://github.com/SkyComic-hash/hwfetch-live"

[tool.setuptools.packages.find]
include = ["hwfetch_live*"]

[tool.setuptools.package-data]
hwfetch_live = ["styles.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
